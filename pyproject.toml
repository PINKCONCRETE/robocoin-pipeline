[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robocoin-pipeline"
version = "0.1.0"
description = "RoboCOIN distributed task orchestration with Prefect and Dask for ad-hoc LAN clusters (multi-machine or single-machine)."
readme = "README.md"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.10"

dependencies = [
    "prefect",
    "dask[distributed]>=2023.0.0",
    "prefect-dask>=0.3.0",
    "lerobot",
    "dacite",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest",
    "ipython",
    "dask[diagnostics]", # for dashboard & performance tools
    "pre-commit",
]
monitor = [
    "prometheus-client", # if you add metrics later
    "bokeh>=3.1.0",      # required for Dask dashboard
]

[project.scripts]
robocoin-pipeline-scheduler = "robocoin_pipeline.cli.scheduler:main"
robocoin-pipeline-worker = "robocoin_pipeline.cli.worker:main"

[project.urls]
Homepage = "https://github.com/yourusername/robocoin-pipeline"
Repository = "https://github.com/yourusername/robocoin-pipeline"
Documentation = "https://github.com/yourusername/robocoin-pipeline#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robocoin-pipeline"]


[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "ANN"]
ignore = ["E501"]
target-version = "py39"

[tool.ruff.flake8-annotations]
# 关键：设为 false 表示不忽略未注解函数 → 强制要求类型注解
ignore-fully-untyped = false

# 可选：要求 __init__ 必须写 -> None
mypy-init-return = false

# 其他可选（按需）：
# suppress-dummy-args = false      # 是否允许省略 self/cls 类型（通常保持默认 true）
# suppress-none-returning = false  # 是否允许省略返回 None 的函数的 -> None
